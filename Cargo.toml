[package]
name = "serica-search"
version = "0.2.0"
edition = "2021"
# Verified empirically against the current dependency graph, not copied
# from a stale 1.80+ documentation claim —
# `cargo +1.86.0 check --all-features` fails (cookie_store/time/time-core/
# time-macros, pulled in transitively via reqwest's `cookies` feature, each
# declare rust-version = "1.88.0"); `cargo +1.88.0 check --all-features`
# succeeds. CI's `msrv` job pins the same 1.88.0 toolchain so the two
# can't silently drift.
rust-version = "1.88"
description = "A single-binary search engine powered by DuckDuckGo. Simple, fast, and AI-ready via MCP."
authors = ["walkthestars <64265241+walkthestars@users.noreply.github.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/walkthestars/serica"
homepage = "https://github.com/walkthestars/serica"
keywords = ["search", "duckduckgo", "mcp", "rust"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1.47", features = ["full"] }
axum = "0.8.9"
reqwest = { version = "0.13", features = ["json", "rustls", "cookies", "stream", "gzip", "brotli"] }
scraper = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.29", features = ["tokio-comp", "aio", "connection-manager"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
url = "2"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "compression-gzip", "compression-br", "limit", "timeout"] }
tower = "0.5"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rs-trafilatura = { version = "0.2.2", default-features = false }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
governor = "0.10.4"
lol_html = "3.0.1"
# Entity-decoding for the whole-doc extract fallback (extract pipeline plan,
# Change 5): small, no_std-friendly, decodes both named and
# numeric entities without hand-rolling a partial table or re-invoking
# html5ever a second time just for this.
html-escape = "0.2"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
temp-env = "0.2"
# Test-only: builds a gzip-compressed decompression-bomb fixture for
# `read_capped_body` coverage. Already present transitively (pulled in by
# reqwest's "gzip" feature via async-compression), so this adds no new
# supply-chain surface — just exposes it directly to test code.
flate2 = "1"

[features]
default = ["mcp"]
mcp = []
redis-cache = ["redis"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "serica"
path = "src/main.rs"
